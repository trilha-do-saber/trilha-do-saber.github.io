<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3557E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trilha do Saber">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Trilha do Saber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: uma coluna central larga para tablet; botões grandes para dedos pequenos; modo criança e modo pais com o mesmo sistema */
  --bg:#EAF3FF; --card:#FFFFFF; --ink:#1D2846; --muted:#5D6A8A;
  --pri:#3557E8; --pri-soft:#DCE4FF; --sun:#FFB020; --ok:#1F9D61; --ok-soft:#DDF5E8; --bad:#E5484D; --bad-soft:#FDE4E4;
  --ten:#3557E8; --ten-cell:#8FA6FF; --one:#FFB020;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
#app{max-width:860px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 2px 0 rgba(29,40,70,.06)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
.muted{color:var(--muted)}
.btn{min-height:60px;padding:0 26px;border-radius:18px;background:var(--pri);color:#fff;font-size:22px;box-shadow:0 4px 0 #2340B8;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2340B8}
.btn.ghost{background:var(--pri-soft);color:var(--pri);box-shadow:0 4px 0 #B8C6FF}
.btn.okb{background:var(--ok);box-shadow:0 4px 0 #147447}
.btn.small{min-height:44px;font-size:17px;padding:0 16px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hello{font-size:34px}
.goal{display:flex;flex-direction:column;gap:6px;min-width:220px}
.bar{height:16px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 22px}
.subj{border-radius:20px;padding:14px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:4px;border:3px solid transparent}
.subj.on{border-color:var(--pri)}
.subj .ic{font-size:30px}
.subj small{color:var(--muted);font-size:14px}
.subj.soon{opacity:.55}
.path{display:flex;flex-direction:column;gap:14px}
.node{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:24px;padding:14px 18px;text-align:left;width:100%;box-shadow:0 4px 0 rgba(29,40,70,.08)}
.node .badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--pri-soft);flex:none}
.node.done .badge{background:var(--ok-soft)}
.node.locked{opacity:.5}
.node h3{font-size:24px}
.stars{font-size:22px;letter-spacing:2px}
.stars .off{filter:grayscale(1);opacity:.35}
.parentlink{margin-top:28px;text-align:center}
.parentlink button{color:var(--muted);font-size:15px;text-decoration:underline}
.lesson-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.steps{display:flex;gap:6px;flex:1}
.steps i{flex:1;height:10px;border-radius:99px;background:var(--pri-soft)}
.steps i.on{background:var(--pri)}
.steps i.okd{background:var(--ok)}
.steps i.bad{background:var(--bad)}
.timer{font-size:15px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--card);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.qtext{font-family:var(--display);font-size:30px;line-height:1.2;max-width:30ch}
.speak{width:52px;height:52px;border-radius:50%;background:var(--pri-soft);font-size:24px;flex:none}
.speak.on{background:var(--sun)}
.visual{min-height:40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;width:100%;max-width:560px}
.opt{min-height:84px;border-radius:22px;background:var(--pri-soft);font-family:var(--display);font-size:40px;color:var(--ink);box-shadow:0 5px 0 #B8C6FF}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--ok);color:#fff;box-shadow:0 5px 0 #147447}
.opt.wrong{background:var(--bad-soft);color:var(--bad);box-shadow:none;opacity:.8;pointer-events:none}
.opts.locked .opt{pointer-events:none}
.opts.txt .opt{font-size:26px;font-family:var(--body);font-weight:800}
.opts.sent{grid-template-columns:1fr}
.opts.sent .opt{font-size:22px;font-family:var(--body);font-weight:800;text-align:left;padding:12px 18px;min-height:64px}
.fb{width:100%;max-width:600px;border-radius:20px;padding:14px 18px;font-size:20px;display:none;text-align:left}
.fb.show{display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--ok-soft);color:#11603B}
.fb.try{background:#FFF1D6;color:#7A4B00}
.fb.bad{background:var(--bad-soft);color:#8E1F23}
.fb .ai{background:#fff;border-radius:14px;padding:10px 12px;color:var(--ink);font-size:18px}
.blocks{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
.ten{display:flex;flex-direction:column;gap:2px;padding:3px;background:var(--ten);border-radius:5px}
.ten i{display:block;width:16px;height:11px;background:var(--ten-cell);border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(3,18px);gap:4px;margin-left:6px}
.ones i{display:block;width:18px;height:18px;background:var(--one);border-radius:4px}
.big{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.cap{font-size:20px;color:var(--muted)}
.cd{color:var(--ten);font-family:var(--display);font-size:56px}
.cu{color:#C27C00;font-family:var(--display);font-size:56px}
.emo{font-size:40px;line-height:1.3;letter-spacing:2px;max-width:420px}
.emo .op{color:var(--pri);font-family:var(--display);margin:0 8px}
.fly{display:inline-block;opacity:.35;transform:translateY(-10px)}
.numline{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.numline b{min-width:78px;height:78px;border-radius:18px;background:var(--pri-soft);display:grid;place-items:center;font-family:var(--display);font-size:38px;font-variant-numeric:tabular-nums}
.numline b.q{background:var(--sun);color:#fff}
.numline b.hi{background:var(--pri);color:#fff}
.conta{font-family:var(--display);font-size:52px;line-height:1.05;text-align:right;font-variant-numeric:tabular-nums;display:inline-flex;flex-direction:column;padding:0 10px}
.conta .op{color:var(--pri);margin-right:16px}
.conta .linha{border-top:5px solid var(--ink);margin:6px 0}
.vs{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.vs>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.vs b{font-family:var(--display);font-size:40px}
.buildarea{min-height:150px;width:100%;max-width:560px;border:3px dashed #B8C6FF;border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:center}
.buildbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.result{text-align:center;align-items:center}
.result .bigstars{font-size:64px;letter-spacing:6px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.pop,.shake{animation:none}}
/* PIN */
.pin{max-width:360px;margin:30px auto;text-align:center}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--pri-soft)}
.dots i.f{background:var(--pri)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{height:64px;border-radius:18px;background:var(--card);font-size:28px;box-shadow:0 3px 0 rgba(29,40,70,.1)}
/* Parent */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:14px}
.pill.ok{background:var(--ok-soft);color:#11603B}
.pill.no{background:var(--bad-soft);color:#8E1F23}
.pill.mid{background:#FFF1D6;color:#7A4B00}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px;border-bottom:2px solid #D5DDEE}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart b{width:100%;max-width:30px;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.chart b.goalhit{background:var(--ok)}
.chart span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart em{font-style:normal;font-size:11px;color:var(--muted)}
.chartx{display:flex;gap:6px}
.chartx span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #E3E9F5;vertical-align:top}
th{color:var(--muted);font-size:13px;font-weight:800}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.sec h2{font-size:24px}
.meter{display:inline-block;width:80px;height:8px;border-radius:99px;background:#E3E9F5;vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted)}
.form input[type=text],.form input[type=number],.form input[type=password]{height:48px;border-radius:12px;border:2px solid #D5DDEE;padding:0 12px;font:inherit;color:var(--ink);font-size:18px;background:#fff}
.check{flex-direction:row!important;align-items:center;color:var(--ink)!important;font-size:17px!important}
.check input{width:24px;height:24px}
.aibox{background:var(--card);border-radius:18px;padding:16px 18px;font-size:16px;line-height:1.5;font-weight:600;max-width:70ch}
.aibox ul{margin:6px 0;padding-left:20px}
.note{background:#FFF1D6;color:#7A4B00;border-radius:14px;padding:10px 14px;font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;z-index:9;display:none}
.toast.show{display:block}
html.fundo{background:#FDECF6 url(img/fundo.webp) repeat;background-size:384px auto}
html.fundo body{background:transparent}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 22px}
.mini{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 14px;text-align:left;width:100%;box-shadow:0 3px 0 rgba(29,40,70,.08)}
.mini .ic{font-size:34px;flex:none}
.mini>span:nth-child(2){display:flex;flex-direction:column;gap:2px;flex:1}
.mini small{color:var(--muted);font-size:14px;line-height:1.3}
.mini .speak{width:44px;height:44px;font-size:20px}
.numdisp{min-width:150px;height:84px;padding:0 20px;border-radius:20px;background:#fff;border:3px solid var(--pri);display:grid;place-items:center;font-family:var(--display);font-size:52px;font-variant-numeric:tabular-nums}
.numkeys{width:100%;max-width:330px}
.numkeys button{background:var(--pri-soft)}
.numkeys .nkok{background:var(--ok);color:#fff}
.dinheiro{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.nota{display:inline-grid;place-items:center;width:112px;height:56px;border-radius:8px;color:#fff;font-family:var(--display);font-size:24px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.moeda{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#D4A017);color:#5C4300;font-family:var(--display);font-size:16px;box-shadow:inset 0 0 0 3px #F2C94C}
.potes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.potes span{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--pri-soft);border-radius:16px;padding:10px;font-size:30px}
.potes b{font-size:15px}
.grade{display:grid;grid-template-columns:repeat(4,64px);gap:4px;background:#D5DDEE;padding:4px;border-radius:12px}
.grade span{width:64px;height:64px;background:#fff;border-radius:8px;display:grid;place-items:center;font-size:36px}
.sel{height:48px;border-radius:12px;border:2px solid #D5DDEE;padding:0 10px;font:inherit;font-size:17px;color:var(--ink);background:#fff}
@media (max-width:520px){.hello{font-size:28px}.qtext{font-size:25px}.big{font-size:52px}.opt{font-size:34px;min-height:74px}}
</style>
</head>
<body>
<div id="app"><div class="card" style="margin-top:40px;text-align:center">Carregando a trilha…</div></div>
<div class="toast" id="toast"></div>
<script src="conteudo.js"></script>
<script src="app.js"></script>
</body>
</html>
